[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-world-model-control"
version = "0.1.0"
description = "One-Shot Visual Imitation Learning and Latent World Model Control for Manipulators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vivek Vijaykumar"}
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "h5py>=3.8.0",
    "pyyaml>=6.0",
    "timm>=0.9.0",
    "einops>=0.6.0",
    "opencv-python>=4.7.0",
    "tqdm>=4.65.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jepa_control*"]
